# Builds the image and chart for a version tag and pushes both to ghcr.io.
# Runs only on the GitHub replica, where GITHUB_TOKEN can write packages; the
# primary repo's runner skips it.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wallflower:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/wallflower:latest
      - uses: azure/setup-helm@v4
      - name: Push the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm package chart --version "$VERSION" --app-version "$VERSION"
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "wallflower-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
